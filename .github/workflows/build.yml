name: Build and push hms-detection

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hms-homelab/hms-detection

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases on tag builds
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from CMake
        id: version
        run: |
          VERSION=$(grep 'project.*VERSION' yolo_detection_cpp/CMakeLists.txt | grep -oP '\d+\.\d+\.\d+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            orgs/${{ github.repository_owner }}/packages/container/hms-detection \
            -f visibility=public || echo "Could not set visibility (may need org admin token)"

      # ── Tag builds: extract the compiled binary from the image and publish it ──
      # The binary is a Debian-trixie CPU build (apt libonnxruntime) — a portable
      # convenience artifact, NOT the GPU build. The supported production path is a
      # local GPU build (cmake --preset gpu). See release notes below.
      - name: Extract binary from image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          docker pull "$IMG"
          CID=$(docker create "$IMG")
          docker cp "$CID:/usr/local/bin/hms_detection" ./hms_detection
          docker rm "$CID"
          chmod +x ./hms_detection
          sha256sum ./hms_detection | tee hms_detection.sha256
          tar -czf hms-detection-linux-amd64.tar.gz hms_detection hms_detection.sha256
          ls -lh hms-detection-linux-amd64.tar.gz

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: hms-detection-linux-amd64.tar.gz
          generate_release_notes: true
          body: |
            Automated release built from the Docker image for this tag.

            **`hms-detection-linux-amd64.tar.gz`** contains the `hms_detection`
            binary (Debian trixie, **CPU** ONNX Runtime) plus its sha256. This is a
            portable convenience artifact — the supported production path on the NVR
            is a local **GPU** build (`cmake --preset gpu`), which links the CUDA
            ONNX Runtime from `/opt/onnxruntime-gpu`.
